<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>00 Navigation map</title>
  <desc>How users move between the ten screens of the Paper Trading App.</desc>
  <defs>
    <style>
    .h1 { font-size: 28px; font-weight: 700; fill: #ECEEF1; }
    .hero { font-size: 44px; font-weight: 700; fill: #ECEEF1; }
    .h2 { font-size: 18px; font-weight: 600; fill: #ECEEF1; }
    .b { font-size: 14px; fill: #ECEEF1; }
    .bb { font-size: 14px; font-weight: 600; fill: #ECEEF1; }
    .s { font-size: 12px; fill: #9AA1AB; }
    .sb { font-size: 12px; font-weight: 600; fill: #9AA1AB; }
    .m { font-size: 11px; fill: #646B75; }
    .btn { font-size: 14px; font-weight: 700; fill: #0E1013; }
    .pill { font-size: 13px; font-weight: 700; fill: #0E1013; }
    .up { fill: #3DD68C; }
    .dn { fill: #FF6A4D; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/>
    </marker>
  </defs>
  <rect width="1280" height="800" fill="#0E1013"/>
  <text x="40" y="56" class="h1">Navigation map</text>
  <text x="40" y="82" class="s">Paper Trading App · desktop, 1280×800 · arrows show how users move between screens</text>

