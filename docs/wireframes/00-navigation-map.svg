  <text x="40" y="490" class="m">Log out lives under Account in the sidebar.</text>
  <path d="M500 416 L554 416" fill="none" stroke="#9AA1AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M584 166 L638 166" fill="none" stroke="#9AA1AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M584 296 L638 296" fill="none" stroke="#9AA1AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
