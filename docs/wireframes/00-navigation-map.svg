  <rect x="996" y="706" width="60" height="4" rx="2" fill="#3A4049"/>
  <rect x="996" y="714" width="100" height="4" rx="2" fill="#262A31"/>
  <path d="M1110 720 L1120 712 L1130 715 L1144 704" fill="none" stroke="#3DD68C" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Sidebar nav band -->
  <rect x="556" y="120" width="28" height="612" rx="14" fill="#1F2329"/>
  <text x="574" y="426" class="sb" text-anchor="middle" transform="rotate(-90 574 426)">SIDEBAR NAV (ON EVERY SCREEN AFTER LOGIN)</text>

  <!-- Arrows -->
