  <path d="M840 166 L958 166" fill="none" stroke="#9AA1AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="899" y="158" text-anchor="middle" class="m">pick a result</text>
  <path d="M840 286 C900 286 900 196 958 196" fill="none" stroke="#9AA1AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="846" y="276" class="m">click holding</text>
  <path d="M840 546 C930 546 920 220 958 200" fill="none" stroke="#9AA1AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="846" y="536" class="m">click trade</text>
  <path d="M400 370 C400 20 1060 20 1060 118" fill="none" stroke="#9AA1AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="700" y="40" text-anchor="middle" class="m">click watchlist row</text>
  <path d="M1040 212 L1040 378" fill="none" stroke="#9AA1AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="1048" y="300" class="m">Buy / Sell</text>
  <path d="M1080 378 L1080 214" fill="none" stroke="#9AA1AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="1088" y="330" class="m">filled → back</text>
  <path d="M958 426 L842 426" fill="none" stroke="#9AA1AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="900" y="418" text-anchor="middle" class="m">limit order placed</text>
  <path d="M840 686 L958 686" fill="none" stroke="#9AA1AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="899" y="678" text-anchor="middle" class="m">tab</text>
  <path d="M958 706 L842 706" fill="none" stroke="#9AA1AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="960" y="520" width="280" height="92" rx="12" fill="#16191E"/>
  <text x="980" y="548" class="bb">Reading this map</text>
  <text x="980" y="570" class="s">Boxes = screens (file number shown)</text>
  <text x="980" y="590" class="s">Arrows = the click that moves you</text>
  <text x="40" y="776" class="m">Wireframe 00 · Navigation map</text>
</svg>
