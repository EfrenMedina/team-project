<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>01 Login and Sign up</title>
  <desc>Wireframe 01 (US-01, US-02): log-in card and sign-up card with a validation error.</desc>
  <defs>
    <style>
    .h1 { font-size: 28px; font-weight: 700; fill: #ECEEF1; }
    .hero { font-size: 44px; font-weight: 700; fill: #ECEEF1; }
    .h2 { font-size: 18px; font-weight: 600; fill: #ECEEF1; }
    .b { font-size: 14px; fill: #ECEEF1; }
    .bb { font-size: 14px; font-weight: 600; fill: #ECEEF1; }
    .s { font-size: 12px; fill: #9AA1AB; }
    .sb { font-size: 12px; font-weight: 600; fill: #9AA1AB; }
    .m { font-size: 11px; fill: #646B75; }
    .btn { font-size: 14px; font-weight: 700; fill: #0E1013; }
    .pill { font-size: 13px; font-weight: 700; fill: #0E1013; }
    .up { fill: #3DD68C; }
    .dn { fill: #FF6A4D; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/>
    </marker>
  </defs>
  <rect width="1280" height="800" fill="#0E1013"/>

  <!-- Left: product intro -->
  <rect x="96" y="96" width="28" height="28" rx="7" fill="#1F2329"/>
  <path d="M102 116 L108 109 L113 113 L119 104" fill="none" stroke="#3DD68C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="134" y="115" class="bb">Paper Trading App</text>
  <text x="96" y="296" class="hero" style="font-size:40px">Practise investing</text>
  <text x="96" y="340" class="h2">with $10,000.00 of simulated money.</text>
  <text x="96" y="372" class="s">Real prices. No real risk.</text>
  <path d="M96.0,610.0 L101.4,608.4 L106.8,607.8 L112.2,608.4 L117.6,608.9 L123.0,607.6 L128.4,604.4 L133.8,597.2 L139.1,586.5 L144.5,574.0 L149.9,564.2 L155.3,560.6 L160.7,557.6 L166.1,553.8 L171.5,549.7 L176.9,551.1 L182.3,552.8 L187.7,559.7 L193.1,569.4 L198.5,579.7 L203.9,585.1 L209.3,583.8 L214.7,581.8 L220.0,577.5 L225.4,572.9 L230.8,570.2 L236.2,563.9 L241.6,554.1 L247.0,541.6 L252.4,532.2 L257.8,522.9 L263.2,519.8 L268.6,518.6 L274.0,519.1 L279.4,517.1 L284.8,514.1 L290.2,513.0 L295.6,513.1 L300.9,511.5 L306.3,513.0 L311.7,512.4 L317.1,507.8 L322.5,506.0 L327.9,507.7 L333.3,503.1 L338.7,505.2 L344.1,509.6 L349.5,509.8 L354.9,512.6 L360.3,517.8 L365.7,517.2 L371.1,520.0 L376.4,520.0 L381.8,515.7 L387.2,510.0 L392.6,499.8 L398.0,484.3 L403.4,470.8 L408.8,463.2 L414.2,456.6 L419.6,456.0 L425.0,457.8 L430.4,463.8 L435.8,468.7 L441.2,477.1 L446.6,479.8 L452.0,487.2 L457.3,495.1 L462.7,499.5 L468.1,498.1 L473.5,498.7 L478.9,499.0 L484.3,502.4 L489.7,505.4 L495.1,514.9 L500.5,529.4 L505.9,535.5 L511.3,530.8 L516.7,526.6 L522.1,519.6 L527.5,508.0 L532.9,494.6 L538.2,482.6 L543.6,469.5 L549.0,455.5 L554.4,447.5 L559.8,440.4 L565.2,432.3 L570.6,430.0 L576.0,430.0" fill="none" stroke="#3DD68C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Log in card (US-02) -->
  <text x="640" y="144" class="m">LOG IN</text>
  <rect x="640" y="160" width="280" height="460" rx="16" fill="#16191E"/>
  <rect x="664" y="184" width="232" height="36" rx="8" fill="#1A1D22"/>
  <rect x="666" y="186" width="114" height="32" rx="7" fill="#1F2329"/>
  <text x="723" y="207" text-anchor="middle" class="bb">Log in</text>
  <text x="837" y="207" text-anchor="middle" class="s">Sign up</text>
  <text x="664" y="252" class="s">Username</text>
  <rect x="664" y="262" width="232" height="40" rx="8" fill="#1A1D22" stroke="#3A4049" stroke-width="1"/>
  <text x="676" y="287.0" class="b">jordan.lee</text>
  <text x="664" y="328" class="s">Password</text>
  <rect x="664" y="338" width="232" height="40" rx="8" fill="#1A1D22" stroke="#3A4049" stroke-width="1"/>
  <text x="676" y="363.0" class="b">••••••••••</text>
  <rect x="664" y="406" width="232" height="44" rx="22" fill="#3DD68C"/>
  <text x="780.0" y="433.0" text-anchor="middle" class="btn">Log in</text>
  <text x="780" y="482" text-anchor="middle" class="b" xml:space="preserve" style="white-space:pre"><tspan class="s">New here? </tspan><tspan class="sb">Sign up</tspan></text>
  <text x="664" y="570" class="m">Wrong username or password shows:</text>
  <text x="664" y="588" class="m">“! Username or password is incorrect”</text>

  <!-- Sign up card (US-01) showing a validation error -->
  <text x="952" y="144" class="m">SIGN UP (WITH A VALIDATION ERROR)</text>
  <rect x="952" y="160" width="280" height="460" rx="16" fill="#16191E"/>
  <rect x="976" y="184" width="232" height="36" rx="8" fill="#1A1D22"/>
  <rect x="1092" y="186" width="114" height="32" rx="7" fill="#1F2329"/>
  <text x="1035" y="207" text-anchor="middle" class="s">Log in</text>
  <text x="1149" y="207" text-anchor="middle" class="bb">Sign up</text>
  <text x="976" y="252" class="s">Username</text>
  <rect x="976" y="262" width="232" height="40" rx="8" fill="#1A1D22" stroke="#FF6A4D" stroke-width="1"/>
  <text x="988" y="287.0" class="b">jordan.lee</text>
  <text x="976" y="320" class="s dn">! That username is already taken</text>
  <text x="976" y="350" class="s">Password</text>
  <rect x="976" y="360" width="232" height="40" rx="8" fill="#1A1D22" stroke="#3A4049" stroke-width="1"/>
  <text x="988" y="385.0" class="b">••••••••</text>
  <text x="976" y="424" class="s">Confirm password</text>
  <rect x="976" y="434" width="232" height="40" rx="8" fill="#1A1D22" stroke="#3A4049" stroke-width="1"/>
  <text x="988" y="459.0" class="b">••••••••</text>
  <text x="976" y="494" class="m">At least 8 characters.</text>
  <rect x="976" y="512" width="232" height="44" rx="22" fill="#3DD68C"/>
  <text x="1092.0" y="539.0" text-anchor="middle" class="btn">Create account</text>
  <text x="976" y="588" class="s">New accounts start with $10,000.00 cash.</text>
  <text x="24" y="776" class="m">Wireframe 01 · Login / Sign up · US-01, US-02</text>
</svg>
