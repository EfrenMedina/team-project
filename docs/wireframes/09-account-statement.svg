  <text x="66" y="708" class="bb">jordan.lee</text>
  <text x="66" y="726" class="s">Log out</text>
  <text x="24" y="776" class="m">Wireframe 09 · US-11</text>
  <text x="256" y="76" class="h1">Statements</text>
