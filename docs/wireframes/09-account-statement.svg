  <text x="1080" y="317.0" text-anchor="end" class="b"></text>
  <text x="1240" y="317.0" text-anchor="end" class="b">$10,094.10</text>
  <line x1="256" y1="332" x2="1240" y2="332" stroke="#262A31" stroke-width="1"/>
  <text x="256" y="357.0" class="b">Oct 6</text>
  <text x="380" y="357.0" class="b">Buy 6 AAPL @ $226.80</text>
  <text x="1080" y="357.0" text-anchor="end" class="b">−$1,360.80</text>
  <text x="1240" y="357.0" text-anchor="end" class="b">$8,733.30</text>
  <line x1="256" y1="372" x2="1240" y2="372" stroke="#262A31" stroke-width="1"/>
