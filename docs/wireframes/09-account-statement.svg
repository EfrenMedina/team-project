  <text x="380" y="437.0" class="b">Buy 8 MSFT @ $412.00</text>
  <text x="1080" y="437.0" text-anchor="end" class="b">−$3,296.00</text>
  <text x="1240" y="437.0" text-anchor="end" class="b">$2,748.30</text>
  <line x1="256" y1="452" x2="1240" y2="452" stroke="#262A31" stroke-width="1"/>
  <text x="256" y="477.0" class="b">Oct 15</text>
  <text x="380" y="477.0" class="b">Buy 10 NVDA @ $131.40</text>
  <text x="1080" y="477.0" text-anchor="end" class="b">−$1,314.00</text>
  <text x="1240" y="477.0" text-anchor="end" class="b">$1,434.30</text>
  <line x1="256" y1="492" x2="1240" y2="492" stroke="#262A31" stroke-width="1"/>
  <text x="256" y="517.0" class="b">Oct 17</text>
  <text x="380" y="517.0" class="b">Buy 4 AAPL @ $229.30</text>
  <text x="1080" y="517.0" text-anchor="end" class="b">−$917.20</text>
  <text x="1240" y="517.0" text-anchor="end" class="b">$517.10</text>
  <line x1="256" y1="532" x2="1240" y2="532" stroke="#262A31" stroke-width="1"/>
  <text x="256" y="557.0" class="b">Oct 20</text>
  <text x="380" y="557.0" class="b">Sell 3 MSFT @ $420.15</text>
  <text x="1080" y="557.0" text-anchor="end" class="b">+$1,260.45</text>
  <text x="1240" y="557.0" text-anchor="end" class="b">$1,777.55</text>
  <line x1="256" y1="572" x2="1240" y2="572" stroke="#262A31" stroke-width="1"/>
  <text x="256" y="597.0" class="b">Oct 22</text>
  <text x="380" y="597.0" class="b">Buy 10 NVDA @ $134.60</text>
  <text x="1080" y="597.0" text-anchor="end" class="b">−$1,346.00</text>
  <text x="1240" y="597.0" text-anchor="end" class="b">$431.55</text>
  <line x1="256" y1="612" x2="1240" y2="612" stroke="#262A31" stroke-width="1"/>
  <text x="256" y="637.0" class="b">Oct 24</text>
  <text x="380" y="637.0" class="b">Sell 2 TSLA @ $255.10</text>
  <text x="1080" y="637.0" text-anchor="end" class="b">+$510.20</text>
  <text x="1240" y="637.0" text-anchor="end" class="b">$941.75</text>
  <line x1="256" y1="652" x2="1240" y2="652" stroke="#262A31" stroke-width="1"/>
  <text x="256" y="677.0" class="bb">Oct 26</text>
  <text x="380" y="677.0" class="bb">Closing balance</text>
  <text x="1080" y="677.0" text-anchor="end" class="bb"></text>
  <text x="1240" y="677.0" text-anchor="end" class="bb">$941.75</text>
  <text x="256" y="722" class="m">Each line is one ledger entry. Closing balance = opening balance + every amount above.</text>
</svg>
