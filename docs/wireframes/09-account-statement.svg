  <rect x="1020" y="96" width="220" height="36" rx="8" fill="#1A1D22" stroke="#3A4049" stroke-width="1"/>
  <text x="1032" y="119.0" class="b">Oct 1 – Oct 26, 2026</text>
  <path d="M1218 112.0 L1223 117.0 L1228 112.0" fill="none" stroke="#9AA1AB" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="256" y="156" width="234" height="84" rx="12" fill="#16191E"/>
  <text x="276" y="186" class="s">Opening balance</text>
  <text x="276" y="214" class="h2">$10,094.10</text>
  <rect x="506" y="156" width="234" height="84" rx="12" fill="#16191E"/>
  <text x="526" y="186" class="s">Money in</text>
  <text x="526" y="214" class="h2">+$1,770.65</text>
  <rect x="756" y="156" width="234" height="84" rx="12" fill="#16191E"/>
  <text x="776" y="186" class="s">Money out</text>
  <text x="776" y="214" class="h2">−$10,923.00</text>
