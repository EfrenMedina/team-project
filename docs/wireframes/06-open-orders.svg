<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>06 Open orders</title>
  <desc>Wireframe 06 (US-10): open limit orders with cancel, the cancel dialog and an automatic-fill notice.</desc>
  <defs>
    <style>
    .h1 { font-size: 28px; font-weight: 700; fill: #ECEEF1; }
    .hero { font-size: 44px; font-weight: 700; fill: #ECEEF1; }
    .h2 { font-size: 18px; font-weight: 600; fill: #ECEEF1; }
    .b { font-size: 14px; fill: #ECEEF1; }
    .bb { font-size: 14px; font-weight: 600; fill: #ECEEF1; }
    .s { font-size: 12px; fill: #9AA1AB; }
    .sb { font-size: 12px; font-weight: 600; fill: #9AA1AB; }
    .m { font-size: 11px; fill: #646B75; }
    .btn { font-size: 14px; font-weight: 700; fill: #0E1013; }
    .pill { font-size: 13px; font-weight: 700; fill: #0E1013; }
    .up { fill: #3DD68C; }
    .dn { fill: #FF6A4D; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/>
    </marker>
  </defs>
  <rect width="1280" height="800" fill="#0E1013"/>

  <!-- Left sidebar: navigation (same on every screen after login) -->
  <rect x="0" y="0" width="216" height="800" fill="#16191E"/>
  <rect x="24" y="28" width="28" height="28" rx="7" fill="#1F2329"/>
  <path d="M30 48 L36 41 L41 45 L47 36" fill="none" stroke="#3DD68C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="62" y="47" class="bb">Paper Trading App</text>
  <text x="32" y="116" class="b">Dashboard</text>
  <text x="32" y="160" class="b">Search</text>
  <text x="32" y="204" class="b">Portfolio</text>
  <rect x="16" y="223" width="184" height="38" rx="8" fill="#1F2329"/>
  <text x="32" y="248" class="bb">Orders</text>
  <text x="32" y="292" class="b">History</text>
  <text x="32" y="336" class="b">Statements</text>
  <text x="32" y="380" class="b">Account</text>
  <circle cx="40" cy="712" r="16" fill="#1F2329"/>
  <text x="40" y="716" text-anchor="middle" class="sb">JL</text>
  <text x="66" y="708" class="bb">jordan.lee</text>
  <text x="66" y="726" class="s">Log out</text>
  <text x="24" y="776" class="m">Wireframe 06 · US-10</text>
  <text x="256" y="76" class="h1">Orders</text>
  <text x="256" y="124" class="bb">Open (3)</text>
  <rect x="256" y="134" width="64" height="2" rx="1" fill="#ECEEF1"/>
  <text x="352" y="124" class="b">Filled</text>
  <text x="432" y="124" class="b">Cancelled</text>
  <text x="1240" y="124" text-anchor="end" class="s">$270.00 held for open buy orders</text>

  <!-- Table (JTable): numbers right-aligned -->
  <text x="256" y="170" class="sb">Placed</text>
  <text x="410" y="170" class="sb">Symbol</text>
  <text x="500" y="170" class="sb">Side</text>
  <text x="580" y="170" class="sb">Type</text>
  <text x="720" y="170" text-anchor="end" class="sb">Shares</text>
  <text x="850" y="170" text-anchor="end" class="sb">Limit price</text>
  <text x="980" y="170" text-anchor="end" class="sb">Last price</text>
  <text x="1020" y="170" class="sb">Status</text>
  <text x="1240" y="170" text-anchor="end" class="sb"></text>
  <line x1="256" y1="182" x2="1240" y2="182" stroke="#262A31" stroke-width="1"/>
  <text x="256" y="215.0" class="b">Oct 26, 10:42</text>
  <text x="410" y="215.0" class="bb">NVDA</text>
  <text x="500" y="215.0" class="b">Buy</text>
  <text x="580" y="215.0" class="b">Limit</text>
  <text x="720" y="215.0" text-anchor="end" class="b">2</text>
  <text x="850" y="215.0" text-anchor="end" class="b">$135.00</text>
  <text x="980" y="215.0" text-anchor="end" class="b">$138.72</text>
  <text x="1020" y="215.0" class="b">Open</text>
  <text x="1240" y="215.0" text-anchor="end" class="b"></text>
  <line x1="256" y1="238" x2="1240" y2="238" stroke="#262A31" stroke-width="1"/>
  <text x="256" y="271.0" class="b">Oct 25, 15:10</text>
  <text x="410" y="271.0" class="bb">AAPL</text>
  <text x="500" y="271.0" class="b">Sell</text>
  <text x="580" y="271.0" class="b">Limit</text>
  <text x="720" y="271.0" text-anchor="end" class="b">5</text>
  <text x="850" y="271.0" text-anchor="end" class="b">$240.00</text>
  <text x="980" y="271.0" text-anchor="end" class="b">$232.14</text>
  <text x="1020" y="271.0" class="b">Open</text>
  <text x="1240" y="271.0" text-anchor="end" class="b"></text>
  <line x1="256" y1="294" x2="1240" y2="294" stroke="#262A31" stroke-width="1"/>
  <text x="256" y="327.0" class="b">Oct 24, 16:20</text>
  <text x="410" y="327.0" class="bb">TSLA</text>
  <text x="500" y="327.0" class="b">Sell</text>
  <text x="580" y="327.0" class="b">Limit</text>
  <text x="720" y="327.0" text-anchor="end" class="b">3</text>
  <text x="850" y="327.0" text-anchor="end" class="b">$265.00</text>
  <text x="980" y="327.0" text-anchor="end" class="b">$251.30</text>
  <text x="1020" y="327.0" class="b">Open</text>
  <text x="1240" y="327.0" text-anchor="end" class="b"></text>
  <line x1="256" y1="350" x2="1240" y2="350" stroke="#262A31" stroke-width="1"/>
  <rect x="1150" y="194" width="90" height="32" rx="16" fill="none" stroke="#3A4049" stroke-width="1"/>
  <text x="1195.0" y="214.0" text-anchor="middle" class="sb">Cancel</text>
  <rect x="1150" y="250" width="90" height="32" rx="16" fill="none" stroke="#3A4049" stroke-width="1"/>
  <text x="1195.0" y="270.0" text-anchor="middle" class="sb">Cancel</text>
  <rect x="1150" y="306" width="90" height="32" rx="16" fill="none" stroke="#3A4049" stroke-width="1"/>
  <text x="1195.0" y="326.0" text-anchor="middle" class="sb">Cancel</text>
  <text x="256" y="380" class="m">Limit orders are checked against new prices and fill automatically; filled orders move to the Filled tab.</text>

  <!-- Cancel confirmation dialog (JOptionPane-style) -->
  <text x="256" y="436" class="m">AFTER CLICKING CANCEL</text>
  <rect x="256" y="450" width="420" height="200" rx="14" fill="#16191E" stroke="#3A4049" stroke-width="1"/>
  <text x="280" y="490" class="h2">Cancel this order?</text>
  <text x="280" y="520" class="s">Buy 2 NVDA at $135.00 limit. The $270.00 held for it goes</text>
  <text x="280" y="537" class="s">back to your buying power.</text>
  <rect x="400" y="586" width="120" height="40" rx="20" fill="none" stroke="#3A4049" stroke-width="1"/>
  <text x="460.0" y="610.0" text-anchor="middle" class="bb">Keep order</text>
  <rect x="536" y="586" width="120" height="40" rx="20" fill="#ECEEF1"/>
  <text x="596" y="611" text-anchor="middle" class="btn">Cancel order</text>

  <!-- Automatic fill notice (US-10 part 2) -->
  <text x="716" y="436" class="m">WHEN A LIMIT ORDER FILLS</text>
  <rect x="716" y="450" width="524" height="96" rx="14" fill="#16191E"/>
  <text x="740" y="490" class="b" xml:space="preserve" style="white-space:pre"><tspan class="bb up">✓ </tspan><tspan class="bb">Limit order filled: bought 2 NVDA at $135.00</tspan></text>
  <text x="740" y="516" class="s">Oct 27, 09:31 · Added to Portfolio and Trade history</text>
</svg>
